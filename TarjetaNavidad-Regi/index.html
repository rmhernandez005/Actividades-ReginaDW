<!-- Este desarrollo vamos a diseñar una tarjeta interativa de navidad -->
 <!-- Nombre: Regina Hernandez -->
  <!-- Actividad 1 -->

<!DOCTYPE html> <!-- Esta etiqueta declara el tipo de documento -->
<html lang="es">
<head>
    <!--El titulo de la pagina no es visible en el desarrollo pero es lo que funciona para el SEO-->
<title>Tarjeta de Navidad | Personalizados </title>
<!--En la etiqueta head va todo lo que no es visible en la pagina web pero la hace funcional-->
<!--A continuacion los metadatos para que la pagina reconozca, caracteres especiales, y se adapte a diferentes diapositivos-->
<meta charset="UTF-8"> <!-- Este metadato es para los caracteres especiales-->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Tarjeta de navidad interactiva con diseño personalizado">
<meta name="author" content="Regina Hernandez">

<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

<link rel="stylesheet" href="styles.css">

</head> <!--HASTA AQUI VA EL HEAD-->

<!--AQUI INICIA EL BODY-->

<body>
    <div class="main-container">
   <!-- Cover -->
   <div class="page active" id="page-0">
    <div class="float-container">
     <img src="navidad.jpg" alt="Arbol de navidad" class="cover-img">
    </div>
    <h1 class="cover-title">Feliz Navidad 2026 ❤️</h1>
    <p class="cover-subtitle">Con todo mi cariño, ¡Felices fiestas! </p>
    <button id="btn-enter" class="btn-primary">
      <span class="btn-text">Entrar </span>
    </button>
   </div>

   <!--Mensaje pagina 1-->
   <div class="page" id="pagina1">
    <div class="photo-circle">
      <img class="photo-img" loading="lazy" src="gato.jpg" alt="Gato con gorro de navidad">
    </div>
    <p class="msg-text">Que esta Navidad esté llena de paz y amor en tu hogar. 🎀</p>
    <button id="btn-next-1" class="btn-secondary">
      <span class="btn-text">Siguiente</span>
    </button>
   </div>
   <!--Mensaje pagina 2 -->

   <div class="page" id="pagina2">
    <h2 class="gallery-title">Los amo familia ✨</h2>
    <div class="gallery-grid">
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="abus.jpg" alt="Personas abrazandose">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="max.jpg" alt="Dos hermanos comiendo pozole">
     </div>
     <div class="gallery-item gold-border">
      <img class="gallery-img" loading="lazy" src="roo.jpg" alt="Un adulto con su mascota">
     </div>
    </div>
  
    <p class="gallery-caption">Cada foto guarda un recuerdo especial con amor 📸</p>
   </div>

<!-- Boton para revelar un mensaje -->

    <div class="page" id="pagina3">
    <div class="float-container float">
     <span class="heart-emoji">🎅</span>
    </div>
    <p class="msg-text">¡Descubre tu mensaje secreto!</p>
    <button id="btn-reveal" class="btn-309ebc">
      <span class="btn-text">Haz click!</span>
    </button>
   </div>

<!--Mensaje final -->

<div class="page" id="pagina4">
    <div id="final-card" class="final-card">
    <audio id="navidad-audio" src="navidadaudio.mp3"></audio>
     <div class="photo-circle gold-border final-photo">
      <img class="photo-img" loading="lazy" src="perrito.jpg" alt="Perritos navideños">
     </div>
     <h2 class="final-title">!Felices fiestas!</h2>
     <p class="final-msg">Te deseo mucho amor, paz y tranquilidad!</p>
     <button id="btn-audio-ebc" class="btn-heart">
      <span id="ebc-audio-btn-text">💗</span>
     </button>
    </div>
    <div id="confetti-container" class="confetti-container"></div>
   </div>

<!--Navegacion de la tarjeta -->

 <nav class="nav-container" aria-label="Navegación de páginas">
    <button id="btn-prev" class="btn-nav" aria-label="Anterior">
      <i data-lucide="chevron-left" class="icon-nav"></i>
    </button>
    <div id="dots" class="dots-container"></div>
    <button id="btn-next" class="btn-nav" aria-label="Siguiente">
      <i data-lucide="chevron-right" class="icon-nav"></i>
    </button>
   </nav>
  </div>

<script src="script.js"></script>

</body>

</html>
